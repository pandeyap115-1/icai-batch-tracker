name: ICAI Tracker Check

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:

jobs:
  check-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Generate and Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'SCRIPT_EOF' > run_tracker.py
          import os
          import requests
          from playwright.sync_api import sync_playwright

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          URL = "https://www.icaionlineregistration.org/LaunchBatchDetail.aspx"
          REGION = "Western"
          COURSE = "Advanced (ICITSS) MCS Course"

          # All target branches checked simultaneously every cycle
          POU_TARGETS = ["MUMBAI", "VASAI", "THANE"]

          def send_telegram(text: str):
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": text,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print(f"[-] Telegram failed: {e}")

          def inspect_branch(page, target: str):
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              dropdowns = page.locator("select")
              
              dropdowns.nth(0).select_option(label=REGION)
              page.wait_for_timeout(3000)
              
              dropdowns.nth(1).select_option(label=target)
              page.wait_for_timeout(3000)
              
              dropdowns.nth(2).select_option(label=COURSE)
              page.wait_for_timeout(3000)
              
              page.locator("input[value='Get List'], button:has-text('Get List')").first.click()
              page.wait_for_timeout(4000)
              
              rows = page.locator("table tr").all()
              open_batch_cards = []
              
              for row in rows[1:]:
                  cols = [c.strip() for c in row.locator("td").all_inner_texts()]
                  if len(cols) >= 5:
                      try:
                          seats = int(cols[1])
                          if seats > 0:
                              batch_no = cols[0]
                              from_date = cols[2]
                              to_date = cols[3]
                              batch_time = cols[4]
                              card = (
                                  f"🔹 *Batch:* `{batch_no}`\n"
                                  f"🪑 *Seats Left:* *{seats}*\n"
                                  f"📅 *Dates:* {from_date} to {to_date}\n"
                                  f"⏰ *Timing:* {batch_time}\n"
                              )
                              open_batch_cards.append(card)
                      except ValueError:
                          continue
                          
              if open_batch_cards:
                  return "\n".join(open_batch_cards)
              return None

          def main():
              print(f"Checking all branches: {', '.join(POU_TARGETS)}")

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0")
                  page = context.new_page()

                  for target in POU_TARGETS:
                      try:
                          batch_info = inspect_branch(page, target)
                          if batch_info:
                              msg = (
                                  f"🚨 *SEATS AVAILABLE - {target}!*\n\n"
                                  f"{batch_info}\n"
                                  f"🔗 [Direct Registration Link]({URL})"
                              )
                              send_telegram(msg)
                              print(f"[!] Active seats found for {target}!")
                          else:
                              print(f"[-] {target}: No open seats.")
                      except Exception as err:
                          print(f"[-] Error checking {target}: {err}")

          if __name__ == "__main__":
              main()
          SCRIPT_EOF
          python3 run_tracker.py
